<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title data-i18n="text:title"></title>
        <link rel="stylesheet" href="css/modelproto.css"/>
        <script src="js/lang.js"></script>
        <script defer src="js/modelproto_lang.js"></script>
        <script defer src="js/common_io.js"></script>
        <script defer src="js/modelproto.js"></script>
        <script defer src="js/modelproto_dragdrop.js"></script>
        <script defer src="js/modelproto_dialogs.js"></script>
    </head>
    <body onload="initModelProto()">
        <!-- Menu -->
        <header class="topbar">
            <div class="topbar-left">
                <img src="images/logo.png" class="logo"/>
                <span class="title" data-i18n="text:proto_header"></span>
                <button id="savebtn" onclick="save()" data-i18n="text:save"></button>
                <button id="generate" onclick="generatepage()" data-i18n="text:generate"></button>
                <span id="workspace_content"></span>
            </div>
        </header>

        <div id="main">
            <!-- workspace -->
            <div id="workspace-panel" class="panel">
                <div class="panel-header">
                    <div>
                        <button id="addtable" class="btn btn-secondary" style="font-weight:bold;" onclick="addTable()" data-i18n="title:param">Ajouter une table</button> 
                        <button id="addrelation" class="btn btn-secondary" style="font-weight:bold;" onclick="" data-i18n="title:css">Ajouter une relation</button> 
                        <span data-i18n="text:workspace"></span>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="workspace"></div>
                </div>
            </div>
        </div>

        <div id="dialogOverlay" class="dialog-overlay hidden">
            <div id="dialog" class="dialog-popup">
                <div id="dialogHeader" class="dialog-header"></div>
                <div id="dialogContent"></div>
            </div>
        </div>
    </body>
</html>
