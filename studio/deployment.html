<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title data-i18n="text:deployment"></title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="stylesheet" href="css/deployment.css">
        <script src="js/lang.js"></script>
        <script defer src="js/common_io.js"></script>
        <script defer src="js/deployment.js"></script>
        <script defer src="js/deployment_dialogs.js"></script>
        <script defer src="js/deployment_lang.js"></script>
    </head>
    <body onload="initDeployment()">
        <header class="topbar">
            <div class="topbar-left">
                <img src="images/logo.png" class="logo"/>
                <span class="title" data-i18n="text:deployment"></span>
            </div>
        </header>
        <div id="main">
            <div class="panel">
                <h4 data-i18n="text:menu"></h4>

                <a href="../studio/docs/index.html" target="_blank">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M9 18h6M10 14h4M12 2a7 7 0 0 0-4 12.9V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.1A7 7 0 0 0 12 2z"/>
                    </svg>
                    <span data-i18n="text:help"></span>
                </a>

                <a href="#" onclick="addprofile()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Fiche du profil -->
                        <path d="M13 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10 a2 2 0 0 1 2 2v7"/>
                        <!-- Paramètres -->
                        <path d="M7 8h6M7 12h6M7 16h3"/>
                        <!-- Nouveau -->
                        <circle cx="18" cy="18" r="5" fill="#22c55e" stroke="none"/>
                        <path d="M18 15.5v5M15.5 18h5" stroke="#fff"/>
                    </svg>
                    <span data-i18n="text:addprofile"></span>
                </a>

                <a href="#" onclick="window.close()" class="danger">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <path d="M16 17l5-5-5-5"/>
                        <path d="M21 12H9"/>
                    </svg>
                    <span data-i18n="text:back"></span>
                </a>
            </div>
            <div class="panel">
                <h4 data-i18n="text:listprofiles"></h4>
                <div id="profiles"></div>
            </div>
            <div id="footer">Beetle studio &copy; 2026</div>
        </div>

        <div id="dialog" class="dialog-popup">
            <div id="dialogHeader" class="dialog-header"></div>
            <div id="dialogContent"></div>
        </div>
    </body>
</html>
